name: phylogas_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core Python & Package Managers
  - python>=3.10,<3.13
  - pip
  - setuptools<81
  - six

  # Data Science & Math
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - pyarrow

  # Graph & Visualization
  - networkx
  - matplotlib
  - seaborn

  # Bioinformatics
  - biopython

  # Utilities & Testing
  - pyyaml
  - requests
  - us
  - pytest>=7.0
  - snakemake>=7.0

  # Satellite Repositories (Installed via pip)
  - pip:
    - git+https://github.com/aswarren/pango_aliasor.git
    - git+https://github.com/NSSAC/BeyondBaseline.git
    - git+https://github.com/NSSAC/TwinSampler.git
