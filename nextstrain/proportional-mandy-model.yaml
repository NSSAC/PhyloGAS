inputs:
  - name: syn_gen_proportional
    metadata: data/mandys_proprtional/andrew_modified.metadata.tsv.xz
    aligned: data/mandys_proprtional/andrew_modified.fasta.xz

builds:
  proportional-mandy-model-build:
    subsampling_scheme: all

filter:
  skip_diagnostics: true # Some quality control still takes place
  min_length: 10

# TreeTime settings
refine:
  root: "Wuhan-Hu-1/2019"
  clock_rate: 0.0008
  clock_std_dev: 0.0004
  coalescent: "opt"
  date_inference: "marginal"
  divergence_unit: "mutations"
  clock_filter_iqd: 8

subsampling:
  my_custom_scheme:
    country:
      # other subsampling parameters...
      max_sequences: 1000
      include: data/reference_id.txt

    #files:
  # Not used when "aligned" is used for the sequences
  # alignment_reference: data/va_delta_ref.sequences.fasta

