inputs:
  - name: syn_gen_proportional
    metadata: data/run_03_with_delta_proportional_reference.metadata.tsv.xz
    aligned: data/run_03_with_delta_proportional_reference.sequences.fasta.xz

builds:
  proportional-mandy-model-build3:
    subsampling_scheme: my_custom_scheme
    auspice_config: config/auspice_augmented.json

filter:
  skip_diagnostics: true # Some quality control still takes place
  min_length: 10
  group_by: country year month sex county latitude longitude age_group smh_race

# TreeTime settings
refine:
  root: "Wuhan-Hu-1/2019"
  clock_rate: 0.0008
  clock_std_dev: 0.0004
  coalescent: "opt"
  date_inference: "marginal"
  divergence_unit: "mutations"
  clock_filter_iqd: 8

traits:
  proportional=mandy-model-build3: ### build name
    sampling_bias_correction: 2.5
    columns: ["country", "region", "county"]

subsampling:
  my_custom_scheme:
    country:
      # other subsampling parameters...
      max_sequences: 1000
      include: data/reference_id.fasta

files:
  # auspice_config: config/auspice_augmented.json
  lat_longs: config/va_lat_longs.tsv  
  # Not used when "aligned" is used for the sequences
  # alignment_reference: data/va_delta_ref.sequences.fasta

