# Generated by scripts/make_state_configs.py for Minnesota (mn).
# Regenerate rather than edit; change the template or the script.
# ===========================================================================
# PhyloGAS pipeline configuration
#
#   cp config.template.yaml config.yaml
#   $EDITOR config.yaml
#   phylogas validate-config --config config.yaml
#
# Any string may reference another key with {dotted.path}; references are
# expanded after loading, so ordering does not matter.
# ===========================================================================

project_name: "{population.state}_delta_wave"
random_seed: 43

# Where large inputs live, and where outputs are written.
#
# The rule: data_dir holds *inputs* -- anything fetched or handed to the
# pipeline. results_dir holds everything *derived*, under numbered stages
# (00_mutation_model, 01_synthetic_genomes, ...).
#
# results_dir carries {project_name}, so two projects never write over each
# other and a whole run is one self-contained directory to archive or delete.
data_dir: "data"
results_dir: "results/{project_name}"

# --- Remote data sources ---------------------------------------------------
# Everything is fetched from Zenodo. UVA Dataverse proved unreliable
# (website 502, metadata API 500, file API ~50% 503 as of 2026-09-30), so the
# synthetic populations were mirrored. Dataverse DOIs are retained in
# src/phylogas/sources.py for citation.
#
# Synthetic populations, one record per state:
#   va 10.5281/zenodo.23088534    ga 10.5281/zenodo.23088629
#   ma 10.5281/zenodo.23088723    mn 10.5281/zenodo.23088773
#   wa 10.5281/zenodo.23088830    ca 10.5281/zenodo.23088872
#
# EpiHiper simulation replicates, one record for all states:
zenodo_doi: "10.5281/zenodo.23067670"

# ---------------------------------------------------------------------------
# 1. Digital twin population
# ---------------------------------------------------------------------------
population:
  # Changing state means changing these two lines. Every per-state path,
  # the geography in sequence names, and the painted window's start tick and
  # date are derived from them.
  state: "mn"
  state_name: "Minnesota"

  # The DERIVED demographics table -- NOT the EpiHiper persontrait file.
  #
  # This distinction matters and is a known source of confusion. The raw
  # `<state>_persontrait_epihiper.txt` from Dataverse:
  #   * opens with a one-line EpiHiper JSON schema header, and
  #   * has `county_fips` rather than `county`, and
  #   * has NO home_latitude / home_longitude at all in the v2.4.0 schema
  #     (they moved to residence_locations, reached via household.rlid), and
  #   * has `hispanic` rather than `latino`.
  #
  # Build the correct file with:
  #   phylogas fetch-data --states va          # downloads + builds it
  # or explicitly:
  #   phylogas build-demographics \
  #       --persontrait va/va_persontrait_epihiper.txt.xz \
  #       --person      va/va_person.csv.xz \
  #       --household   va/va_household.csv.xz \
  #       --residence   va/va_residence_locations.csv.xz \
  #       --fips        {data_dir}/county_fips.csv \
  #       --out         {data_dir}/va/va_2_4_0_demographics.csv
  demographics_file: "{data_dir}/{population.state}/{population.state}_2_4_0_demographics.csv"

  # Raw Dataverse files (consumed by TwinSampler and by build-demographics).
  # pandas reads .xz natively, so there is no need to decompress them.
  persontrait_raw: "{data_dir}/{population.state}/{population.state}_persontrait_epihiper.txt.xz"
  household_file: "{data_dir}/{population.state}/{population.state}_household.csv.xz"
  residence_file: "{data_dir}/{population.state}/{population.state}_residence_locations.csv.xz"
  person_file: "{data_dir}/{population.state}/{population.state}_person.csv.xz"

  # County FIPS -> name lookup (small; committed to the repo).
  fips_file: "{data_dir}/county_fips.csv"

  # USDA ERS rural-urban continuum codes. TwinSampler ships the 2023 table and
  # uses it by default; set this only to run against another edition
  # (`phylogas fetch-data --with-rucc` downloads the current one to data/).
  rucc_file: ""


# ---------------------------------------------------------------------------
# 2. Variant of interest
# ---------------------------------------------------------------------------
variant:
  pango: "B.1.617.2"          # Delta
  label: "delta"
  # Include descendant lineages? With this ON the CovSpectrum query becomes
  # "B.1.617.2*" and descendants (AY.44, AY.103, ...) roll up to the requested
  # ancestor. Turning it off restricts to sequences assigned to exactly this
  # lineage -- for Virginia Delta that is 836 samples instead of 21,034.
  include_sublineages: true


# ---------------------------------------------------------------------------
# 3. Seed acquisition  (phylogas prep-seeds)
# ---------------------------------------------------------------------------
seeds:
  output_folder: "{data_dir}/importations/sequences"
  # Skip TLS verification when fetching the UCSC cluster TSV. The
  # clustertracker.gi.ucsc.edu certificate expired 2025-07-02; until it is
  # renewed, --seed_mode cannot download its input without this. Prefer
  # --input_file with a local copy where practical.
  insecure_download: false
  # Cluster table to build the schedule and seeds from.
  #  * This snapshot is what the published EpiHiper schedules came from; every
  #    state's schedule reproduces from it exactly. Use it to re-seed an
  #    EXISTING run: the seeds must match the ABM's importations day for day,
  #    and even one extra importation shifts every later pairing.
  #    It covers only CA, GA, MA, MN, VA and WA.
  #  * Empty downloads UCSC's full hardcoded_clusters.tsv: any state, and the
  #    right choice for a NEW ABM run, since prep-seeds then writes the
  #    schedule and the seeds together. For the five simulated states it is
  #    within 0.5% of the snapshot (Delta: +0 to +18 importations, same first
  #    day), so it is the same data a few revisions later.
  input_file: "{data_dir}/importations/sarscov2_clusters_2024_11_12_filtered.tsv.gz"
  # How to drop temporal outliers when choosing importation seeds:
  #   none | chaining | iqr | zscore
  #
  # `prep-seeds` writes the importation schedule and the seed FASTA from the
  # same clusters, so a dropped cluster leaves both. The schedules the published
  # EpiHiper runs consumed were built with NO outlier filtering: use "none" to
  # reproduce them, and anything else only when generating a fresh ABM run.
  outlier_method: "none"

  # An importation whose cluster has no sequence in Cov-Spectrum's open data
  # borrows one from the nearest cluster of the same sublineage, recorded in
  # the seed manifest's `surrogate_of` column. This matters where coverage is
  # patchy: 397 of Washington's 3,739 Delta clusters have nothing to fetch,
  # and dropping them would leave the painter with no genome for those chains.
  # true drops them instead.
  no_surrogates: false

  # Earliest plausible date per variant. A cluster whose first sample predates
  # its variant is re-dated to its first sample after this date, and that
  # sample (not the suspect one) becomes its seed. Unset uses the defaults in
  # phylogas.seqprep.cluster_seeds, which reproduce the published schedules.
  #   variant_start: "B.1.1.7=2020-12-01,B.1.617.2=2021-03-01"
  variant_start: ""


# ---------------------------------------------------------------------------
# 3a. The agent-based model
#
# PhyloGAS does not own the ABM's configuration: EpiHiper has its own format
# and PhyloGAS reads what it needs rather than keeping a second copy. Today
# that is tick 0, which fixes the whole calendar: every tick in the EpiHiper
# output, the seed schedule and the painted metadata is counted from it.
# ---------------------------------------------------------------------------
abm:
  type: "epihiper"
  # EpiHiper's config.json, whose "tickZero" dates tick 0. The bundled
  # experiment used 2020-11-30 for every state, deliberately, so each state's
  # ticks sit on one shared calendar.
  config: "cfg/exp1/config.json"
  # Only needed for an ABM whose config does not carry the date.
  tick_zero: ""
  # The importation schedule the ABM actually ran for the painted variant
  # (absolute ticks, `tick,count`). The "-2" is variant 2, matching
  # genetic_painter.painted_prefix "E2". `prep-seeds --abm-config` writes the
  # same thing as <State>_<lineage>_ticks.csv for a new run.
  seed_schedule: "{data_dir}/seed_schedule/{population.state}-2.csv"


# ---------------------------------------------------------------------------
# 3b. Training sequences for the mutational model
#     (phylogas fetch-data --with-training-sequences)
#
# seq_prep.py's *bulk* mode -- a separate path from --seed_mode -- queries
# Cov-Spectrum over a date range and writes the alignment that `phylogas
# train` reads as genetic_painter.align_fasta.
#
# The window runs from genetic_painter.start_date for `days` days, or between
# explicit date_from/date_to when both are set. With neither, it is the
# painted window itself (start_date through start_date + num_ticks).
# ---------------------------------------------------------------------------
training:
  # Length of the training window, in days from the painted start date
  # (genetic_painter.start_date: the state's first Delta importation). Kept
  # separate from num_ticks so the mutational model can see more of the wave
  # than is painted. Unset = the painted span.
  days: 400
  # Explicit dates override the above.
  date_from: null             # e.g. "2021-02-01"
  date_to: null               # e.g. "2021-09-01"


# ---------------------------------------------------------------------------
# 4. EpiHiper agent-based simulation output
# ---------------------------------------------------------------------------
epihiper:
  # Transmission log: tick,pid,exit_state,contact_pid,location_id
  #
  # Published on Zenodo, one replicate per state (~0.4-0.6 GB compressed):
  #   doi:10.5281/zenodo.23067670   (concept doi:10.5281/zenodo.23067669)
  # Fetch with:  phylogas fetch-data --states va --with-simulations
  #
  # Available: va, ga, ma, mn, wa  (no California replicate published)
  output_csv: "{data_dir}/{population.state}/{population.state}_replicate_0_output.csv.gz"


# ---------------------------------------------------------------------------
# 5. Genetic Painter  (phylogas train / phylogas paint)
# ---------------------------------------------------------------------------
genetic_painter:
  # -- Training inputs (Mode 1: entropy analysis) --------------------------
  # Real-world MSA the entropy "fitness map" is learned from -- an input, so
  # it lives under data_dir. Fetch it with
  #   phylogas fetch-data --config config.yaml --states va --with-training-sequences
  # which queries Cov-Spectrum over the training window above and writes to
  # this path. Cov-Spectrum serves open sequences, so there is no
  # redistribution constraint; it is left out of git only because it is large
  # and reproducible from the window.
  # fetch-data stores it xz-compressed beside this name (.fasta.xz); `train`
  # reads it either way, so leave the name as is.
  align_fasta: "{data_dir}/training_sequences/{population.state}_delta.fasta"

  # -- Fitness map (written by `train`, read by `paint`) -------------------
  # Output of `train`, so it lives under results as stage 00. Point these at
  # a pre-trained map instead if you have one -- the CLI resolves either, and
  # `train` creates the directory it writes into.
  #
  # Note `np.save` appends .npy, so the matrix is written with that suffix
  # whether or not the config says so; the loader tolerates both.
  entropy_thresholds: "{results_dir}/00_mutation_model/{project_name}.thresholds.txt"
  probability_matrix: "{results_dir}/00_mutation_model/{project_name}.base_threshold_df.npy"

  # -- Painting inputs (Mode 2: generation) --------------------------------
  # Written by `phylogas prep-seeds --seed-mode` into seeds.output_folder,
  # which is where this default points. The CLI also derives the name from
  # population.state_name + variant.pango and looks in seeds.output_folder and
  # <data_dir>/<state>/seeds, so a different state or lineage needs no edit
  # here; point it at a staged file if you have one.
  seed_fasta: "{seeds.output_folder}/{population.state_name}_B_1_617_2_seed_sequences.fasta"
  # Used only to emit the reference as the first output record (see
  # emit_reference). The ancestral genomes come from seed_fasta, not from here.
  reference_fasta: "{data_dir}/reference/reference.fasta"

  # Write the reference as the first record of the output FASTA and metadata.
  #
  # reference_fasta is headed "Wuhan/Hu-1/2019", which is what ncov's
  # refine.root names, so with this on the painted FASTA is self-rooting --
  # usable by augur or TreeTime directly, no Nextstrain install needed.
  #
  # Off by default because the --linelist-filter output sets do not get it,
  # so the sets would disagree about whether the root is present. Through ncov
  # it is redundant anyway (reference_data supplies the root), though harmless
  # now that reference_fasta is byte-identical to ncov's copy. Turn it on for
  # standalone use.
  #
  # Either way the clock metrics read reference_fasta directly, not this
  # record, so mu_truth is unaffected.
  emit_reference: false
  output_prefix: "{results_dir}/01_synthetic_genomes/{project_name}"

  # Which EpiHiper exit states to paint. A prefix captures every age-group
  # suffix (E2_a, E2_s, ...). "E2" = variant 2 exposure.
  painted_prefix: "E2"

  # -- Mutation engine ------------------------------------------------------
  # rate_limit : biophysical, burst-size + Poisson driven (recommended)
  # simple     : per-site threshold draw
  # poor       : 50% random substitution null model
  mutation_model: "rate_limit"
  initial_viral_load: 10        # transmission bottleneck
  proportional: true            # use MSA-derived substitution probabilities

  # -- Time window -----------------------------------------------------------
  # start_tick: first ABM tick painted. "auto" = the painted variant's first
  #   importation, read from abm.seed_schedule (VA Delta: 128, MA: 103).
  #   Give a number to start later on purpose.
  # start_date: "auto" = abm tick 0 + start_tick. An explicit date that
  #   disagrees with the ABM calendar is rejected: it would relabel every
  #   painted and line-list date.
  # num_ticks: the span painted.
  start_date: "auto"
  start_tick: "auto"
  num_ticks: 300

  # -- Output filtering ------------------------------------------------------
  # By default every painted infection is written. Each entry here adds an
  # ADDITIONAL output pair restricted to the infections named in that file, so
  # one pass can emit the full tree plus one FASTA per sampling strategy --
  # useful for comparing what Nextstrain reconstructs from each.
  # Identifiers are read from alias_pid, infection_id, strain, sim_pid or pid.
  #   linelist_filters:
  #     - "{results_dir}/02_simulated_linelists/linelist.csv"
  #     - "surs={results_dir}/03_sampled_datasets/4S__surs_samples.csv.xz"
  #     - "lasso={results_dir}/03_sampled_datasets/4S-4_LL-P__lasso_greedy_samples.csv.xz"
  linelist_filters: []

  # -- Metadata --------------------------------------------------------------
  add_metadata: "gender,county,home_latitude,home_longitude,latino,race,smh_race,age_group"
  location:
    country: "USA"
    # "auto": division = population.state_name, divisionAbbr =
    # population.state upper-cased. Override only for a non-state geography.
    division: "auto"
    divisionAbbr: "auto"
    region: "North America"

  # -- Output compression ----------------------------------------------------
  # xz level 1 is ~37x faster than the lzma default (level 6) and still
  # achieves ~320x compression on this highly redundant data. Level 6 costs
  # roughly 6 hours of extra wall time on a 5.3M-record run.
  compression: "xz"
  compression_level: 1
  compression_threads: 8        # 0 = in-process lzma; >0 uses external `xz -T`


# ---------------------------------------------------------------------------
# 6. Ascertainment simulation  (TwinSampler)
# ---------------------------------------------------------------------------
ascertainment:
  parameters: "{data_dir}/ascertainment_parameters.yaml"
  # Importation schedule on absolute ABM ticks (tick, date, variant, clusters,
  # sample_count). Written by `prep-seeds` beside the seeds; `phylogas
  # assign-variants` labels each simulated transmission chain from it.
  schedule_input: "{seeds.output_folder}/{population.state_name}_importation_schedule.csv"
  # How variant labels are assigned to transmission components:
  #   variant_bipartite | variant_temporal | just_components
  # Variant assignment moved to PhyloGAS; TwinSampler now emits component_id
  # only. See benchmark.variant_mode below.
  variant_mode: "just_components"

  # Which variant's states to keep. Applied before the time filter and
  # before component labelling, so it also decides which variant the
  # transmission components describe. Matched as "<variant>_" within the
  # state name. Defaults to the variant token in
  # genetic_painter.painted_prefix, so the painter and the line list cannot
  # describe different epidemics. Set it only to override that.
  #   target_variant: 2

  # Ascertainable state prefixes, matched with startswith. Keep the variant
  # suffix in step with target_variant. Note dM, not dm.
  prefix_override: ["A2", "P2", "I2", "dM2", "hM2"]
  # The extension decides compression: .csv.xz writes xz, .csv writes
  # plain. 1.5M rows is worth compressing, and pandas reads it back
  # transparently downstream.
  output: "{results_dir}/02_simulated_linelists/linelist.csv.xz"


# ---------------------------------------------------------------------------
# 7. Adaptive sampling  (BeyondBaseline)
# ---------------------------------------------------------------------------
sampling:
  algorithms: ["surs", "lasso_greedy"]
  batch_size: 400
  # Not wired yet: the pipeline draws one sample set per recipe. Kept so
  # configs that set it still load.
  replicates: 5
  no_replacement: true
  outdir: "{results_dir}/03_sampled_datasets"

  # Which recipes get a Nextstrain tree. One tree per entry; "all" means
  # every id `scenarios-recipes` prints. A recipe is a scenario and an
  # algorithm together, because the algorithm alone does not identify a
  # sampled set -- 1S__surs and 4S__surs are different trees.
  #
  # An algorithm that ignores the target distribution is named by the axes it
  # actually reads, so SURS is 4S__surs rather than 4S-4_LL-P__surs. The older
  # spelling still resolves, with a note.
  nextstrain_recipes: ["4S__surs"]


# ---------------------------------------------------------------------------
# 8. Phylodynamic reconstruction  (Nextstrain / TreeTime)
# ---------------------------------------------------------------------------
nextstrain:
  enabled: true

  # The ncov checkout this project builds in. Nothing to set: by default it
  # is cloned into the project's results on first use (`phylogas run` does it,
  # or `phylogas ncov-checkout`), from `repo` at the pinned commit `ref`.
  #
  # Each project gets its own checkout because ncov writes
  # results/combined_* at fixed paths shared by every build in a checkout --
  # two projects (states) building in one checkout at once corrupt each
  # other's inputs. The clock benchmark reads the build's results/, so the
  # checkout stays until you delete the project's results.
  dir: "{results_dir}/ncov"
  repo: "https://github.com/nextstrain/ncov.git"
  # Pinned so every project and every rerun builds with the same ncov.
  ref: "3432c85760b6c8cd0f815a85167ebb46c8131abb"
  # Optional: clone from this local checkout instead of `repo` -- for a
  # machine without internet. Its downloaded Nextclade dataset is reused too.
  source_dir: ""

  # How builds run. "nextstrain" (default) uses the Nextstrain CLI;
  # "snakemake" needs no CLI, only snakemake and conda on PATH. See the
  # README's Nextstrain section for setup of each.
  runner: "nextstrain"

  # runner: "snakemake" only. Where the Nextstrain tools environment is built;
  # set it to shared scratch so it is built once and reused across runs.
  #   conda_prefix: "/scratch/$USER/snakemake-conda"
  conda_prefix: ""

  # Where, inside the ncov checkout, `phylogas nextstrain-config` stages this
  # project's inputs and writes each arm's config. It stages rather than
  # points because `nextstrain build <dir>` mounts only that directory --
  # absolute paths elsewhere are invisible under docker and singularity.
  stage_subdir: "data/phylogas/{project_name}"

  outdir: "{results_dir}/04_nextstrain_builds"

  # Molecular clock. The two modes answer different questions and are not
  # interchangeable -- docs/clock_modes.md is the decision record.
  #
  #   operational - ncov's de facto prior (0.0008 / 0.0004). Real and
  #                 simulated data get the IDENTICAL distortion, which is what
  #                 makes their trees comparable. Cannot support a claim about
  #                 the simulation's own rate: the rate was assumed.
  #   generative  - rate fitted from the data. Runs as a separate step
  #                 (`phylogas benchmark clock`) because ncov's refine rule
  #                 passes --clock-rate unconditionally and so cannot be told
  #                 to infer it.
  #   both        - the operational tree plus clock_estimates.csv carrying
  #                 mu_truth, mu_sim and mu_operational.
  #
  # Fit the generative mode on the all_infections arm: root-to-tip regression
  # depends on which tips are present, so on a sampled arm the number is a
  # property of the sampler as much as of the simulation.
  clock:
    mode: "both"

    # Cap on records used for mu_truth. Sampled uniformly across the painted
    # set (reservoir), so the date range is preserved and the slope is
    # unbiased -- unlike the old behaviour, which took the first N in tick
    # order and compressed a 299-day study into 69 days. Unset means use
    # every record, which is now affordable: the divergence count is
    # vectorised, so 5.35M records cost about 3 minutes rather than 160.
    # Set it only to bound memory or runtime further.
    max_records: 200000

  # Which arms to build.
  #   strategy       - one build per BeyondBaseline sampling arm. The focal set
  #                    is taken whole: BeyondBaseline already chose it, and
  #                    re-subsampling would benchmark ncov's sampler instead.
  #   all_infections - the full painted set plus the all-events line list,
  #                    capped at 17,000 by the country_17k scheme. Here the cap
  #                    is the experiment: what does the tree look like with
  #                    complete ascertainment up to that point?
  builds:
    # Which recipes get a tree is sampling.nextstrain_recipes; this list only
    # says whether the all_infections control arm is on.
    - type: strategy
    # - type: all_infections


# ---------------------------------------------------------------------------
# 9. Benchmarking against ground truth
# ---------------------------------------------------------------------------
benchmark:
  outdir: "{results_dir}/05_benchmarks"

  # Matching strategy for `phylogas assign-variants`: bipartite | temporal
  variant_mode: "bipartite"

  # Schedule whose `variant` column becomes each transmission chain's
  # `variant_benchmark` label, the truth the prevalence benchmark scores
  # samples against. assign-variants matches each chain's first tick to the
  # schedule's ticks. Format: tick,date,variant,clusters,sample_count.
  #  - Default: the schedule `prep-seeds` writes, one row per real importation
  #    day, labelled by each cluster's sublineage (AY.44, AY.103, ...).
  #  - Overlay: any other schedule in that format, to test recovery of a
  #    chosen prevalence profile. The original manufactured one is bundled:
  #      variant_schedule: "{data_dir}/variant_overlays/Virginia_importation_schedule.csv"
  variant_schedule: "{seeds.output_folder}/{population.state_name}_importation_schedule.csv"

  # --- Ground-truth inputs --------------------------------------------------
  # Each accepts:
  #   "auto"  derive from ascertainment.output and use it if present (default)
  #   "none"  skip the benchmarks that need it
  #   <path>  use this file
  #
  # TwinSampler names these deterministically, so "auto" is exact rather than a
  # guess. Given ascertainment.output = .../linelist.csv it looks for:
  #     .../linelist_allevents.csv.xz
  #     .../linelist_mugration.json
  # If a file is absent the dependent benchmark is skipped with a reason, which
  # `phylogas status` reports -- nothing fails and nothing is silently scored.

  # Raw all-events file: the INPUT to `phylogas assign-variants`, and what the
  # mugration and sequence benchmarks read. Not the variant-annotated output.
  allevents: "auto"

  # ABM mugration truth matrix. TwinSampler writes this only when the events
  # carry a county column, so "auto" may legitimately resolve to nothing.
  truth_mugration: "auto"
